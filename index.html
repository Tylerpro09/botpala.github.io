<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Búsqueda Avanzado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .filters {
            margin-bottom: 20px;
        }
        .result {
            margin-bottom: 15px;
        }
        .result-title {
            font-weight: bold;
            color: #1a0dab;
        }
        .result-url {
            color: #006621;
            font-size: 12px;
        }
        #pagination button {
            margin: 5px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <h1>Motor de Búsqueda Avanzado</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Escribe tu búsqueda..." onkeyup="search()">
    </div>

    <div class="filters">
        <label for="filter-date">Fecha:</label>
        <input type="date" id="filter-date" onchange="search()">
    </div>

    <div id="results"></div>
    <div id="pagination"></div>

    <script src="search.js"></script>
</body>
</html>
